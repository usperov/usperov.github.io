<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Deutsch</title>

<style>
:root{
  --bg:#060608;--s1:#10101a;--s2:#1a1a28;--border:#22222e;
  --text:#f0f0f8;--muted:#55556a;--muted2:#33334a;
  --der:#5b9cf6;--die:#f06292;--das:#66bb6a;
  --der-bg:rgba(91,156,246,.13);--die-bg:rgba(240,98,146,.13);--das-bg:rgba(102,187,106,.13);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Onest',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}
.screen{min-height:100vh;display:flex;flex-direction:column;padding:24px 20px 32px;animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;min-height:44px}
.back{background:none;border:none;color:var(--muted);font:500 14px 'Onest',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0}
.back svg{width:16px;height:16px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--s1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8}
.screen-title{font-size:22px;font-weight:700;letter-spacing:-.5px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:16px 10px;text-align:center}
.stat-n{font-size:26px;font-weight:800;letter-spacing:-1px}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
/* Nav buttons */
.nav-btn{width:100%;background:var(--s1);border:1px solid var(--border);border-radius:18px;padding:18px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .15s;margin-bottom:10px;font-family:'Onest',sans-serif}
.nav-btn:active{background:var(--s2)}
.nav-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.nav-t{font-size:15px;font-weight:600;color:var(--text);text-align:left}
.nav-s{font-size:12px;color:var(--muted);margin-top:2px;text-align:left}
.nav-arr{margin-left:auto;color:var(--muted2);font-size:18px}
/* Article */
.article-tag{display:inline-flex;align-items:center;padding:5px 13px;border-radius:9px;font-size:13px;font-weight:700;letter-spacing:.3px}
.a-der{background:var(--der-bg);color:var(--der)}
.a-die{background:var(--die-bg);color:var(--die)}
.a-das{background:var(--das-bg);color:var(--das)}
.a-none{background:var(--s2);color:var(--muted)}
/* Word card */
.word-card{background:var(--s1);border:1px solid var(--border);border-radius:24px;padding:36px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;min-height:200px;transition:transform .15s,background .15s;position:relative;overflow:hidden}
.word-card:active{transform:scale(.98);background:var(--s2)}
.word-main{font-size:34px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
.word-trans{font-size:18px;color:var(--muted);font-weight:400}
.word-hint{font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:4px}
.word-hint svg{width:14px;height:14px;opacity:.6}
/* Progress */
.prog{height:3px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}
.prog-fill{height:100%;background:var(--text);border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
/* Buttons */
.btn{border:none;outline:none;cursor:pointer;font-family:'Onest',sans-serif;border-radius:14px;font-weight:600;transition:transform .13s,opacity .13s;-webkit-font-smoothing:antialiased}
.btn:active{transform:scale(.96);opacity:.85}
.btn-p{background:var(--text);color:var(--bg);padding:17px 24px;font-size:16px;width:100%}
.btn-s{background:var(--s1);color:var(--text);padding:17px 24px;font-size:15px;width:100%;border:1px solid var(--border)}
.btn-mute{background:transparent;color:var(--muted);padding:13px 24px;font-size:14px;width:100%}
.actions{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:9px}
/* Input */
.inp-wrap{position:relative;margin-bottom:10px}
.inp{width:100%;background:var(--s1);border:1.5px solid var(--border);border-radius:14px;padding:16px 18px;font-size:18px;font-family:'Onest',sans-serif;color:var(--text);outline:none;transition:border-color .15s;font-weight:600}
.inp:focus{border-color:var(--text)}
.inp.wrong{border-color:var(--die);animation:shake .3s ease}
.inp.ok{border-color:var(--das)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Attempts */
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border);transition:background .2s}
.dot.used{background:var(--die)}
/* Mode row */
.mode-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.m-btn{background:var(--s1);border:1.5px solid var(--border);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .13s;font-family:'Onest',sans-serif}
.m-btn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8}
.m-btn span{font-size:10px;color:var(--muted)}
.m-btn.active{border-color:var(--text);background:var(--s2)}
.m-btn.active svg{stroke:var(--text)}
.m-btn.active span{color:var(--text)}
/* Choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch-btn{background:var(--s1);border:1.5px solid var(--border);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:all .13s;font-family:'Onest',sans-serif}
.ch-btn:active{transform:scale(.97)}
.ch-art{font-size:11px;font-weight:700;letter-spacing:.4px;margin-bottom:5px}
.ch-word{font-size:15px;font-weight:700;color:var(--text);word-break:break-all}
.ch-btn.ok{border-color:var(--das);background:var(--das-bg)}
.ch-btn.wrong{border-color:var(--die);background:var(--die-bg);opacity:.6}
/* Settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border)}
.set-label{font-size:15px;font-weight:500}
.set-sub{font-size:12px;color:var(--muted);margin-top:2px}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--text)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;background:var(--bg);border-radius:50%;top:3px;left:3px;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--text);height:4px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:500;background:var(--s1);border:1.5px solid var(--border);cursor:pointer;transition:all .13s;font-family:'Onest',sans-serif;color:var(--text)}
.chip.on{border-color:var(--text);background:var(--s2)}
.lvl-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lvl{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;background:var(--s1);border:1.5px solid var(--border);cursor:pointer;font-family:'Onest',sans-serif;color:var(--text);transition:all .13s}
.lvl.on{border-color:var(--text);background:var(--s2)}
/* Section label */
.sec-lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 10px;font-weight:600}
/* Word list */
.wl-item{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);gap:10px}
.wl-de{font-size:16px;font-weight:700}
.wl-ru{font-size:12px;color:var(--muted);margin-top:2px}
.wl-ret{font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;font-family:'Onest',sans-serif;margin-left:auto;flex-shrink:0}
.wl-ret:active{background:var(--s1)}
.badge{background:var(--s2);border:1px solid var(--border);padding:4px 11px;border-radius:8px;font-size:12px;color:var(--muted)}
.scrollable{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scrollable::-webkit-scrollbar{display:none}
.empty{text-align:center;padding:50px 20px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.empty-ico{font-size:44px;margin-bottom:14px}
.empty-t{font-size:18px;font-weight:600;margin-bottom:8px}
.empty-s{font-size:14px;color:var(--muted);line-height:1.5}
/* Answer box */
.ans-box{background:var(--s1);border:1.5px solid var(--border);border-radius:16px;padding:22px;text-align:center;margin-bottom:12px}
.ans-art{font-size:13px;font-weight:700;margin-bottom:8px;letter-spacing:.3px}
.ans-word{font-size:28px;font-weight:800;letter-spacing:-1px}
.ans-ru{font-size:14px;color:var(--muted);margin-top:6px}
/* Counter */
.counter{font-size:13px;color:var(--muted);font-weight:500}
/* Flash feedback */
.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--das-bg);border:1px solid var(--das);border-radius:16px;padding:12px 24px;font-size:16px;font-weight:600;color:var(--das);z-index:100;pointer-events:none;animation:flash .6s ease forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-52%) scale(.9)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
</style>

// ============ PERSISTENCE ============
function save(){
  try{localStorage.setItem('dapp',JSON.stringify({
    settings:S.settings,wordStatus:S.wordStatus,learningSet:S.learningSet
  }))}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('dapp')||'null');
    if(d){S.settings={...S.settings,...d.settings};S.wordStatus=d.wordStatus||{};S.learningSet=d.learningSet||[];}
  }catch(e){}
}

// ============ HELPERS ============
const ws=(id)=>S.wordStatus[id]||'new';
const wordById=(id)=>WORDS.find(w=>w.id===id);

function availableWords(){
  return WORDS.filter(w=>{
    const tOk=S.settings.topics.includes(w.topic);
    const lOk=S.settings.level==='Все'||w.lvl===S.settings.level;
    return tOk&&lOk;
  });
}

function artClass(art){
  if(art==='der')return 'a-der';
  if(art==='die')return 'a-die';
  if(art==='das')return 'a-das';
  return 'a-none';
}
function artColor(art){
  if(art==='der')return 'var(--der)';
  if(art==='die')return 'var(--die)';
  if(art==='das')return 'var(--das)';
  return 'var(--muted)';
}

function formatAnswer(w){return w.art?`${w.art} ${w.de}`:w.de;}

function checkAnswer(inp,w){
  const c=inp.trim().toLowerCase();
  return c===formatAnswer(w).toLowerCase()||c===w.de.toLowerCase();
}

function getChoices(correct,count=4){
  const all=availableWords().filter(w=>w.id!==correct.id&&w.art);
  const others=[...all].sort(()=>Math.random()-.5).slice(0,count-1);
  return [...others,correct].sort(()=>Math.random()-.5);
}

// ============ LEARNING SET ============
function fillSet(){
  const newWords=availableWords().filter(w=>ws(w.id)==='new'&&!S.learningSet.includes(w.id));
  const needed=S.settings.maxWords-S.learningSet.length;
  for(let i=0;i<needed&&i<newWords.length;i++){
    S.learningSet.push(newWords[i].id);
    S.wordStatus[newWords[i].id]='learning';
  }
  save();
}

function markLearned(id){
  S.wordStatus[id]='learned';
  S.learningSet=S.learningSet.filter(x=>x!==id);
  fillSet();save();
}
function returnToLearning(id){
  if(S.learningSet.length<S.settings.maxWords&&!S.learningSet.includes(id)){
    S.learningSet.push(id);
    S.wordStatus[id]='learning';
    save();
  }
}

// ============ RENDER ============
function render(){
  document.getElementById('app').innerHTML='';
  const screens={home:renderHome,settings:renderSettings,learn:renderLearn,review:renderReview,allWords:renderAllWords};
  const el=(screens[S.screen]||renderHome)();
  document.getElementById('app').appendChild(el);
}

function el(tag,cls,html=''){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html)e.innerHTML=html;
  return e;
}

// ---- LEARN NEW WORDS ----
function setupLearn(){
  const av=availableWords();
  const queue=av.filter(w=>ws(w.id)==='new');
  if(queue.length===0){
    // If no new words, show already-learning words for review purposes
    S.learnQ=av.filter(w=>ws(w.id)==='learning').map(w=>w.id);
  } else {
    S.learnQ=queue.map(w=>w.id);
  }
  S.learnQ=[...S.learnQ].sort(()=>Math.random()-.5);
  S.learnIdx=0;S.learnRevealed=false;
}

function renderLearn(){
  const div=el('div','screen');
  const q=S.learnQ;
  const idx=S.learnIdx;

  // Header
  const hdr=el('div','header');
  const back=el('button','back','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Назад');
  back.onclick=()=>{S.screen='home';render()};
  hdr.appendChild(back);
  if(q.length>0){
    const cnt=el('span','counter badge');
    cnt.textContent=`${idx+1} / ${q.length}`;
    hdr.appendChild(cnt);
  }
  div.appendChild(hdr);

  if(q.length===0){
    div.appendChild(renderEmpty('🎉','Все слова изучены!','Ты прошёл все слова в выбранных темах. Сними галочку с уровня или добавь новые темы.'));
    return div;
  }

  // Progress bar
  const prog=el('div','prog');
  const fill=el('div','prog-fill');
  fill.style.width=`${((idx+1)/q.length)*100}%`;
  prog.appendChild(fill);div.appendChild(prog);

  const w=wordById(q[idx]);
  if(!w){S.learnIdx++;if(S.learnIdx<S.learnQ.length){render();}return div;}

  const isInSet=S.learningSet.includes(w.id);
  const isLearned=ws(w.id)==='learned';

  // Word card
  const card=el('div','word-card');
  card.innerHTML=`
    <span class="article-tag ${artClass(w.art)}">${w.art||'—'}</span>
    <div class="word-main">${w.de}</div>
    ${S.learnRevealed
      ? `<div class="word-trans">${w.ru}</div>`
      : `<div class="word-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Нажми, чтобы увидеть перевод</div>`
    }
  `;
  if(!S.learnRevealed){
    card.onclick=()=>{S.learnRevealed=true;render();};
  }
  div.appendChild(card);

  // Actions
  const acts=el('div','actions');
  if(S.learnRevealed){
    if(!isLearned&&!isInSet){
      const b1=el('button','btn btn-p','Учить слово');
      b1.onclick=()=>{
        fillSetWithWord(w.id);
        next();
      };
      acts.appendChild(b1);

      const b2=el('button','btn btn-s','Уже знаю');
      b2.onclick=()=>{S.wordStatus[w.id]='learned';save();next();};
      acts.appendChild(b2);
    } else {
      const b1=el('button','btn btn-s','Пропустить →');
      b1.onclick=()=>next();
      acts.appendChild(b1);
    }
  } else {
    const b=el('button','btn btn-s','Показать перевод');
    b.onclick=()=>{S.learnRevealed=true;render();};
    acts.appendChild(b);
  }

  function next(){
    S.learnIdx++;
    if(S.learnIdx>=S.learnQ.length){S.learnIdx=S.learnQ.length;}
    S.learnRevealed=false;render();
  }

  div.appendChild(acts);
  return div;
}

function fillSetWithWord(id){
  if(!S.learningSet.includes(id)&&S.learningSet.length<S.settings.maxWords){
    S.learningSet.push(id);
    S.wordStatus[id]='learning';
    save();
  } else if(!S.learningSet.includes(id)){
    // replace oldest
    const old=S.learningSet.shift();
    // keep old as learning but out of active set
    S.learningSet.push(id);
    S.wordStatus[id]='learning';
    save();
  }
}

// ---- REVIEW ----
function setupReview(){
  fillSet();
  const q=[...S.learningSet];
  S.reviewQ=q.sort(()=>Math.random()-.5);
  S.reviewIdx=0;
  resetReviewCard();
}

function resetReviewCard(){
  S.reviewInput='';S.reviewAttempts=0;S.reviewShowAns=false;
  S.reviewCorrect=null;S.reviewChoices=[];S.reviewChoiceResult=null;
  const w=wordById(S.reviewQ[S.reviewIdx]);
  if(w)S.reviewChoices=getChoices(w,4);
}

function renderReview(){
  const div=el('div','screen');
  const q=S.reviewQ;

  // Header
  const hdr=el('div','header');
  const back=el('button','back','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Назад');
  back.onclick=()=>{S.screen='home';render()};
  hdr.appendChild(back);
  if(q.length>0){
    const cnt=el('span','counter badge');
    cnt.textContent=`${S.reviewIdx+1} / ${q.length}`;
    hdr.appendChild(cnt);
  }
  div.appendChild(hdr);

  if(q.length===0){
    div.appendChild(renderEmpty('📭','Нечего повторять','Сначала добавь слова для изучения'));
    const acts=el('div','actions');
    const b=el('button','btn btn-p','Учить новые слова');
    b.onclick=()=>{setupLearn();S.screen='learn';render();};
    acts.appendChild(b);div.appendChild(acts);
    return div;
  }

  const w=wordById(q[S.reviewIdx]);
  if(!w){
    reviewNext();return div;
  }

  // Progress
  const prog=el('div','prog');
  const fill=el('div','prog-fill');
  fill.style.width=`${((S.reviewIdx+1)/q.length)*100}%`;
  prog.appendChild(fill);div.appendChild(prog);

  // Russian word (question)
  const qbox=el('div','');
  qbox.style.cssText='text-align:center;margin-bottom:20px;padding:24px;background:var(--s1);border:1px solid var(--border);border-radius:20px';
  qbox.innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;font-weight:600">Переведи на немецкий</div>
  <div style="font-size:28px;font-weight:800;letter-spacing:-1px">${w.ru}</div>`;
  div.appendChild(qbox);

  // Mode selector
  const modeRow=el('div','mode-row');
  const modes=[
    {k:'type',icon:`<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 9h10M7 12h4M7 15h6"/></svg>`,label:'Писать'},
    {k:'choose',icon:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>`,label:'Выбрать'},
    {k:'show',icon:`<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,label:'Показать'},
  ];
  modes.forEach(m=>{
    const mb=el('div',`m-btn${S.reviewMode===m.k?' active':''}`);
    mb.innerHTML=`${m.icon}<span>${m.label}</span>`;
    mb.onclick=()=>{
      if(S.reviewMode!==m.k){S.reviewMode=m.k;S.reviewShowAns=false;S.reviewCorrect=null;S.reviewInput='';S.reviewAttempts=0;S.reviewChoiceResult=null;if(m.k==='choose'){const ww=wordById(q[S.reviewIdx]);if(ww)S.reviewChoices=getChoices(ww,4);}render();}
    };
    modeRow.appendChild(mb);
  });
  div.appendChild(modeRow);

  // Mode content
  if(S.reviewMode==='type'){
    // Attempts dots
    const dotsDiv=el('div','dots');
    for(let i=0;i<3;i++){
      const d=el('div',`dot${i<S.reviewAttempts?' used':''}`);
      dotsDiv.appendChild(d);
    }
    div.appendChild(dotsDiv);

    if(S.reviewShowAns||S.reviewCorrect===true){
      // Show answer
      const ab=el('div','ans-box');
      const ac=el('div','ans-art');
      ac.style.color=artColor(w.art);ac.textContent=w.art||'';
      ab.appendChild(ac);
      const aw=el('div','ans-word');aw.textContent=w.de;ab.appendChild(aw);
      div.appendChild(ab);
    } else {
      const wrap=el('div','inp-wrap');
      const inp=el('input','inp');
      inp.type='text';inp.placeholder=`${w.art||''} …`;
      inp.value=S.reviewInput;
      if(S.reviewCorrect===false)inp.className='inp wrong';
      inp.oninput=(e)=>{S.reviewInput=e.target.value;};
      inp.onkeydown=(e)=>{if(e.key==='Enter')doCheck();};
      wrap.appendChild(inp);div.appendChild(wrap);

      const chk=el('button','btn btn-p','Проверить');
      chk.onclick=doCheck;div.appendChild(chk);
    }

    function doCheck(){
      if(checkAnswer(S.reviewInput,w)){
        S.reviewCorrect=true;S.reviewShowAns=true;
        showFeedback('✓ Верно!');render();
      } else {
        S.reviewAttempts++;
        if(S.reviewAttempts>=3){S.reviewShowAns=true;S.reviewCorrect=false;render();}
        else{S.reviewCorrect=false;render();}
      }
    }

  } else if(S.reviewMode==='choose'){
    if(!S.reviewChoices.length)S.reviewChoices=getChoices(w,4);
    const grid=el('div','choices');
    S.reviewChoices.forEach((cw,i)=>{
      const cb=el('div','ch-btn');
      const isCorrect=cw.id===w.id;
      const chosen=S.reviewChoiceResult!==null;
      let extra='';
      if(chosen&&S.reviewChoiceResult===i)extra=isCorrect?' ok':' wrong';
      else if(chosen&&isCorrect)extra=' ok';
      cb.className='ch-btn'+extra;
      const ca=el('div','ch-art');
      ca.style.color=artColor(cw.art);ca.textContent=cw.art||'—';
      cb.appendChild(ca);
      const cwd=el('div','ch-word');cwd.textContent=cw.de;cb.appendChild(cwd);
      if(!chosen){
        cb.onclick=()=>{
          S.reviewChoiceResult=i;
          if(isCorrect)showFeedback('✓ Верно!');
          render();
        };
      }
      grid.appendChild(cb);
    });
    div.appendChild(grid);
  } else {
    // Show mode
    const ab=el('div','ans-box');
    const ac=el('div','ans-art');
    ac.style.color=artColor(w.art);ac.textContent=w.art||'';
    ab.appendChild(ac);
    const aw=el('div','ans-word');aw.textContent=w.de;ab.appendChild(aw);
    const aru=el('div','ans-ru');aru.textContent=w.ru;ab.appendChild(aru);
    div.appendChild(ab);
  }

  // Bottom actions
  const showBottom=(
    (S.reviewMode==='type'&&(S.reviewShowAns))||
    (S.reviewMode==='choose'&&S.reviewChoiceResult!==null)||
    (S.reviewMode==='show')
  );

  const acts=el('div','actions');
  if(showBottom){
    const b1=el('button','btn btn-p','Запомнил ✓');
    b1.onclick=()=>{markLearned(w.id);reviewNext();};
    acts.appendChild(b1);
    const b2=el('button','btn btn-s','Продолжить учить');
    b2.onclick=()=>reviewNext();
    acts.appendChild(b2);
  }
  div.appendChild(acts);
  return div;
}

function reviewNext(){
  S.reviewIdx++;
  if(S.reviewIdx>=S.reviewQ.length){
    S.reviewIdx=0;
    S.reviewQ=[...S.learningSet].sort(()=>Math.random()-.5);
  }
  resetReviewCard();render();
}

// ---- ALL WORDS ----
function renderAllWords(){
  const div=el('div','screen');
  const hdr=el('div','header');
  const back=el('button','back','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Назад');
  back.onclick=()=>{S.screen='home';render()};
  hdr.appendChild(back);
  hdr.innerHTML+=`<div class="screen-title" style="font-size:18px">Все слова</div><div></div>`;
  div.appendChild(hdr);

  const av=availableWords();
  const learned=av.filter(w=>ws(w.id)==='learned');
  const learning=av.filter(w=>ws(w.id)==='learning');

  const scroll=el('div','scrollable');

  if(learning.length>0){
    const lbl=el('div','sec-lbl','📖 Изучаю сейчас');
    scroll.appendChild(lbl);
    learning.forEach(w=>{
      scroll.appendChild(wordListItem(w,false));
    });
  }

  if(learned.length>0){
    const lbl=el('div','sec-lbl','✅ Выучено');
    scroll.appendChild(lbl);
    learned.forEach(w=>{
      scroll.appendChild(wordListItem(w,true));
    });
  }

  if(learning.length===0&&learned.length===0){
    scroll.appendChild(renderEmpty('📭','Пока пусто','Начни изучать слова, и они появятся здесь'));
  }

  div.appendChild(scroll);
  return div;
}

function wordListItem(w,canReturn){
  const item=el('div','wl-item');
  const artTag=el('span','article-tag '+artClass(w.art));
  artTag.textContent=w.art||'—';
  artTag.style.cssText='font-size:11px;padding:3px 9px;';
  item.appendChild(artTag);
  const info=el('div','');
  info.innerHTML=`<div class="wl-de">${w.de}</div><div class="wl-ru">${w.ru}</div>`;
  item.appendChild(info);
  if(canReturn){
    const ret=el('button','wl-ret','+ Вернуть');
    ret.onclick=()=>{
      if(S.learningSet.length<S.settings.maxWords){
        returnToLearning(w.id);render();
      } else {
        showFeedback('Набор полный!');
      }
    };
    item.appendChild(ret);
  }
  return item;
}

// ---- SETTINGS ----
function renderSettings(){
  const div=el('div','screen');
  const hdr=el('div','header');
  const back=el('button','back','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Назад');
  back.onclick=()=>{S.screen='home';render()};
  hdr.innerHTML=`<div></div><div class="screen-title" style="font-size:18px">Настройки</div>`;
  hdr.prepend(back);
  div.appendChild(hdr);

  const scroll=el('div','scrollable');

  // Level
  const lvlLbl=el('div','sec-lbl','Уровень сложности');
  scroll.appendChild(lvlLbl);
  const lvlChips=el('div','lvl-chips');
  LEVELS.forEach(l=>{
    const c=el('div',`lvl${S.settings.level===l?' on':''}`);
    c.textContent=l;
    c.onclick=()=>{S.settings.level=l;save();render();};
    lvlChips.appendChild(c);
  });
  scroll.appendChild(lvlChips);

  // Word count
  const wcRow=el('div','set-row');
  wcRow.style.marginTop='8px';
  const wcLeft=el('div','');
  wcLeft.innerHTML=`<div class="set-label">Слов одновременно</div><div class="set-sub">Сейчас: <strong>${S.settings.maxWords}</strong></div>`;
  const slider=el('input','');
  slider.type='range';slider.min=3;slider.max=25;slider.value=S.settings.maxWords;
  slider.style.width='120px';
  slider.oninput=(e)=>{
    S.settings.maxWords=parseInt(e.target.value);
    wcLeft.querySelector('.set-sub').innerHTML=`Сейчас: <strong>${S.settings.maxWords}</strong>`;
    save();
  };
  wcRow.appendChild(wcLeft);wcRow.appendChild(slider);
  scroll.appendChild(wcRow);

  // Topics
  const topLbl=el('div','sec-lbl','Темы');
  topLbl.style.marginTop='8px';
  scroll.appendChild(topLbl);
  const chips=el('div','chips');
  Object.entries(TOPICS).forEach(([k,v])=>{
    const c=el('div',`chip${S.settings.topics.includes(k)?' on':''}`);
    c.textContent=`${v.emoji} ${v.label}`;
    c.onclick=()=>{
      const idx=S.settings.topics.indexOf(k);
      if(idx>=0){if(S.settings.topics.length>1)S.settings.topics.splice(idx,1);}
      else S.settings.topics.push(k);
      save();render();
    };
    chips.appendChild(c);
  });
  scroll.appendChild(chips);

  // Reset
  const resetLbl=el('div','sec-lbl','Сброс');
  resetLbl.style.marginTop='8px';
  scroll.appendChild(resetLbl);
  const resetBtn=el('button','btn btn-s','Сбросить весь прогресс');
  resetBtn.style.marginBottom='20px';
  resetBtn.onclick=()=>{
    if(confirm('Сбросить весь прогресс? Это удалит все выученные слова.')){
      S.wordStatus={};S.learningSet=[];save();render();
    }
  };
  scroll.appendChild(resetBtn);

  div.appendChild(scroll);
  return div;
}

// ---- UTILS ----
function renderEmpty(ico,title,sub){
  const d=el('div','empty');
  d.innerHTML=`<div class="empty-ico">${ico}</div><div class="empty-t">${title}</div><div class="empty-s">${sub}</div>`;
  return d;
}

function showFeedback(msg){
  const old=document.querySelector('.feedback');
  if(old)old.remove();
  const f=document.createElement('div');
  f.className='feedback';f.textContent=msg;
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),700);
}

// ============ INIT ============
load();
fillSet();
render();
</script>
</body>
</html>
